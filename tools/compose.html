<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>screens composer</title>
<style>
  html, body { margin: 0; background: transparent; }
  figure { margin: 0; }
  .stage { position: relative; width: 1520px; height: 960px; }

  .laptop {
    position: absolute;
    left: 28px;
    top: 28px;
    width: 1150px;
    border-radius: 14px;
    overflow: hidden;
    background: #0f161e;
    box-shadow: 0 30px 70px rgba(8, 16, 26, 0.45);
  }
  .laptop .bar {
    height: 38px;
    background: #1a2531;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .laptop .bar i { width: 11px; height: 11px; border-radius: 50%; background: #3a4a5c; }
  .laptop img { display: block; width: 100%; }

  .phone {
    position: absolute;
    left: 1092px;
    top: 104px;
    width: 300px;
    padding: 12px;
    background: #0f161e;
    border-radius: 44px;
    box-shadow: 0 26px 60px rgba(8, 16, 26, 0.5), inset 0 0 0 2px #2c3b4c;
  }
  .phone .screen { display: block; border-radius: 32px; overflow: hidden; }
  .phone img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="stage">
    <figure class="laptop">
      <div class="bar"><i></i><i></i><i></i></div>
      <img src="../docs/screenshot-desktop.png" alt="">
    </figure>
    <figure class="phone">
      <span class="screen"><img src="../docs/screenshot-mobile.png" alt=""></span>
    </figure>
  </div>
</body>
</html>
