<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>social preview composer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  html, body { margin: 0; }
  figure { margin: 0; }
  .stage {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background: #0f161e;
    font-family: "Barlow", system-ui, sans-serif;
    color: #edf2f7;
  }

  .copy { position: absolute; left: 64px; top: 92px; width: 520px; }
  .batt {
    position: relative;
    width: 150px;
    height: 46px;
    border: 3px solid #edf2f7;
    border-radius: 9px;
    padding: 4px;
    margin-bottom: 30px;
  }
  .batt::after {
    content: "";
    position: absolute;
    right: -9px;
    top: 50%;
    transform: translateY(-50%);
    width: 6px;
    height: 38%;
    background: #edf2f7;
    border-radius: 0 3px 3px 0;
  }
  .batt-body { display: flex; gap: 3px; height: 100%; }
  .batt-body i { flex: 1; border-radius: 2px; background: rgba(237, 242, 247, 0.14); }
  .batt-body i.on { background: #0ca30c; }

  h1 {
    font-family: "Barlow Condensed", sans-serif;
    font-size: 84px;
    font-weight: 700;
    line-height: 0.95;
    margin: 0 0 22px;
    letter-spacing: 0;
  }
  .es { font-size: 30px; font-weight: 500; color: #edf2f7; margin: 0 0 10px; line-height: 1.3; }
  .en { font-size: 21px; font-weight: 400; color: #8495a9; margin: 0 0 28px; line-height: 1.4; }

  .tags { display: flex; gap: 10px; margin-bottom: 34px; }
  .tags span {
    font-size: 18px;
    font-weight: 500;
    color: #b6c4d4;
    border: 1px solid rgba(237, 242, 247, 0.22);
    border-radius: 999px;
    padding: 6px 16px;
  }
  .url { font-size: 19px; color: #8495a9; }

  .laptop {
    position: absolute;
    left: 648px;
    top: 56px;
    width: 780px;
    border-radius: 12px;
    overflow: hidden;
    background: #16202b;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  }
  .laptop .bar {
    height: 34px;
    background: #1a2531;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .laptop .bar i { width: 10px; height: 10px; border-radius: 50%; background: #3a4a5c; }
  .laptop img { display: block; width: 100%; }

  .phone {
    position: absolute;
    left: 588px;
    top: 196px;
    width: 196px;
    padding: 9px;
    background: #0f161e;
    border-radius: 30px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 0 2px #2c3b4c;
  }
  .phone .screen { display: block; border-radius: 22px; overflow: hidden; }
  .phone img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="stage">
    <div class="copy">
      <div class="batt" aria-hidden="true">
        <div class="batt-body">
          <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i>
        </div>
      </div>
      <h1>ANT BMS Monitor</h1>
      <p class="es">Mira tu batería desde el navegador. Sin instalar nada.</p>
      <p class="en">Zero-install, read-only Web Bluetooth monitor for ANT BMS packs. English + Spanish.</p>
      <div class="tags"><span>Solo lectura</span><span>Web Bluetooth</span><span>ES / EN</span></div>
      <div class="url">github.com/yosle/ant-bms-web</div>
    </div>
    <figure class="laptop">
      <div class="bar"><i></i><i></i><i></i></div>
      <img src="../docs/screenshot-desktop.png" alt="">
    </figure>
    <figure class="phone">
      <span class="screen"><img src="../docs/screenshot-mobile.png" alt=""></span>
    </figure>
  </div>
</body>
</html>
